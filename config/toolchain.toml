# Pinned toolchain for the Pi power HAT. Loaded by tools/toolchain.py, checked by tools/check_toolchain.py.
#
# Per-machine overrides (do not edit this file for your machine). Precedence, highest first:
#   1. environment variables  PIPWR_KICAD_BIN_DIR, PIPWR_JAVA_EXE, PIPWR_FREEROUTING_JAR
#   2. config/toolchain.local.toml  (same tables/keys as here, only the keys you change)
#   3. this file
# Paths may use environment variables (%LOCALAPPDATA%, $HOME): expanded by tools/toolchain.py.

[kicad]
bin_dir = 'C:\Program Files\KiCad\10.0\bin'
version = "10.0.7"

[java]
# The JRE bundled with the Freerouting Windows download.
exe = '%LOCALAPPDATA%\freerouting\jre25\jdk-25.0.4.1+1-jre\bin\java.exe'
min_major = 21

[freerouting]
jar = '%LOCALAPPDATA%\freerouting\freerouting-2.5.0.jar'
version = "2.5.0"
# Matches the sums.txt of https://github.com/freerouting/freerouting/releases/tag/v2.5.0
sha256 = "f6f51bb02245e8e717f9359bd260cc9c5c0b1bc0acc8b7cb2cd5b8ffeb5de3c7"
